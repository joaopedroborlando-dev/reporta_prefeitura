spring:
  application:
    name: api
  datasource:
    url: jdbc:postgresql://localhost:5432/reporta-prefeitura
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8000
  error:
    include-message: always

rsa:
  private-key: classpath:certs/private-key.pem
  public-key: classpath:certs/public-key.pem

security:
  jwt:
    issuer: portal-api
    expiration: 1h

logging:
  level:
    org:
      springframework: INFO
